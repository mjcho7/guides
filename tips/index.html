<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI 활용꿀팁 실습</title>
<meta name="description" content="매주 하나씩, 3분이면 따라 하는 AI 활용꿀팁 실습 모음">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1B2638; --body:#3A4252; --muted:#5B6475; --line:#E4E7EC;
    --gray:#F5F6F8; --coral:#D2552F; --coral-ink:#B8461F; --coral-soft:#FDECE5;
    --bg:#FFFFFF;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:'Noto Sans KR',-apple-system,'Malgun Gothic',sans-serif;line-height:1.6;-webkit-text-size-adjust:100%}
  .wrap{max-width:720px;margin:0 auto;padding:36px 16px 48px}
  .chip{display:inline-block;font-size:13px;font-weight:700;color:var(--coral-ink);background:var(--coral-soft);padding:4px 12px;border-radius:999px}
  h1{font-size:28px;line-height:1.35;font-weight:900;margin:12px 0 8px;letter-spacing:-.3px}
  .lead{font-size:16px;color:var(--body);margin:0}

  .list{list-style:none;margin:28px 0 0;padding:0;display:flex;flex-direction:column;gap:12px}
  .item a{display:flex;align-items:center;gap:16px;text-decoration:none;color:inherit;background:var(--gray);border-radius:16px;padding:16px 18px;min-height:44px;transition:background .15s}
  .item a:hover{background:#ECEEF1}
  .no{flex:none;width:48px;height:48px;border-radius:12px;background:#fff;color:var(--coral);font-weight:900;font-size:16px;display:flex;align-items:center;justify-content:center;border:1.5px solid var(--line)}
  .item.new .no{background:var(--coral);color:#fff;border-color:var(--coral)}
  .txt{flex:1;min-width:0}
  .t{display:block;font-size:17px;font-weight:700}
  .s{display:block;font-size:14px;color:var(--body)}
  .badge{display:inline-block;margin-left:6px;font-size:11.5px;font-weight:700;color:var(--coral-ink);background:var(--coral-soft);padding:1px 8px;border-radius:999px;vertical-align:2px}
  .go{flex:none;color:var(--muted);font-size:18px}

  footer{margin-top:36px;text-align:center;font-size:13px;color:var(--muted)}
  @media (max-width:420px){ h1{font-size:24px} .no{width:42px;height:42px;font-size:15px} }
</style>
</head>
<body>
<main class="wrap">

  <span class="chip">AI 활용꿀팁 실습</span>
  <h1>매주 하나씩,<br>3분이면 따라 하는 AI 꿀팁</h1>
  <p class="lead">뉴스레터에서 소개한 실습을 모두 모아 두었어요. 지난 회차도 언제든 다시 해 보세요.</p>

  <!-- 새 회차는 맨 위에 추가하고, 가장 최신 항목에만 class="item new"와 NEW 배지를 붙이세요 -->
  <ul class="list">
    <li class="item new">
      <a href="/tips/01/">
        <span class="no">#01</span>
        <span class="txt">
          <span class="t">같은 요청, 매번 다시 설명하고 계신가요?<span class="badge">NEW</span></span>
          <span class="s">프로젝트 지침으로 반복 업무 자동화하기</span>
        </span>
        <span class="go" aria-hidden="true">›</span>
      </a>
    </li>
  </ul>

  <footer>한국문화정보원 · AI 활용꿀팁</footer>
</main>
</body>
</html>
